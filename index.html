<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="description" content="沸点火锅点单与门店履约概念演示，非官方产品" />
    <title>沸点 · 火锅点单概念演示</title>
    <script>
      (function () {
        // 同步设置初始语言到 html lang 属性
        try {
          var lang = localStorage.getItem('i18nextLng');
          document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
        } catch (e) {
          // localStorage 不可用时保持默认中文
        }
        // 挂载前同步主题，避免刷新时出现闪烁
        // 偏好取值：system（默认）| light | dark；旧版本只写入 light/dark，仍然兼容。
        var preference = 'system';
        try {
          var storedTheme = localStorage.getItem('theme-mode');
          if (storedTheme === 'dark' || storedTheme === 'light' || storedTheme === 'system') preference = storedTheme;
        } catch (e) {
          preference = 'system';
        }
        var prefersDark = false;
        try {
          prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          prefersDark = false;
        }
        var mode = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
        document.documentElement.classList.toggle('dark', mode === 'dark');
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.themePreference = preference;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute('content', mode === 'dark' ? '#12100d' : '#fbf5ea');
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
